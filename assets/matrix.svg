<style>
text{font-family:'Courier New',Consolas,monospace}
.s{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:1}}
.glow{filter:url(#glow)}
.l{opacity:0;animation:show .4s ease-out forwards}
@keyframes show{to{opacity:1}}
.c{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
