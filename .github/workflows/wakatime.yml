name: Update WakaTime card

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate WakaTime card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: wakatime
          options: 'username=2c21fab2-044d-474d-96bf-3bcf013cc7ed&layout=default&langs_count=6&bg_color=0a0418&title_color=ff3399&text_color=c9b6ff&icon_color=7b2ff7&border_color=5a26b8&hide_border=false'
          path: assets/wakatime.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wakatime.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update wakatime card"
            git push
          fi
