name: Update project card

on:
  push:
    paths:
      - ".github/project.txt"
      - ".github/scripts/project.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate project card
        run: python .github/scripts/project.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/project.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update project card"
            git push
          fi
